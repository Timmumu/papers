
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:16px 0 12px;align-items:center}

.filter-btn.active{background:var(--color-background-info);color:var(--color-text-info);border-color:var(--color-border-info)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px}
.stat-n{font-size:22px;font-weight:500;color:var(--color-text-primary)}
.stat-l{font-size:12px;color:var(--color-text-secondary);margin-top:2px}
.paper-list{display:flex;flex-direction:column;gap:6px}
.paper{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:12px 14px;cursor:pointer;transition:border-color .15s}
.paper:hover{border-color:var(--color-border-secondary)}
.paper-top{display:flex;align-items:flex-start;gap:10px}
.paper-title{font-size:13px;font-weight:500;color:var(--color-text-primary);line-height:1.4;flex:1}
.paper-meta{font-size:11px;color:var(--color-text-tertiary);margin-top:4px;line-height:1.5}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500}
.b-p1{background:#E1F5EE;color:#085041}
.b-p2{background:#E6F1FB;color:#0C447C}
.b-p3{background:#FAEEDA;color:#633806}
.b-p4{background:#F1EFE8;color:#444441}
.b-qual{background:#EAF3DE;color:#27500A}
.b-safe{background:#FAECE7;color:#712B13}
.b-found{background:#EEEDFE;color:#3C3489}

</style>

<h2 class="sr-only">Reading priority dashboard for your digital twin literature collection — 150 papers organised by relevance to cross-stage DT for design-for-quality and design-for-safety.</h2>

<div class="stats" id="stats"></div>

<div class="toolbar">
  <div class="search-wrap"><input type="text" id="search" placeholder="Search title or author..." oninput="render()"></div>
  <button class="filter-btn active" data-f="all" onclick="setFilter('all',this)">All</button>
  <button class="filter-btn" data-f="p1" onclick="setFilter('p1',this)">Must-read</button>
  <button class="filter-btn" data-f="p2" onclick="setFilter('p2',this)">Core</button>

  <button class="filter-btn" data-f="found" onclick="setFilter('found',this)">Foundations</button>

</div>

<div class="paper-list" id="list"></div>

  {t:"Enabling technologies and tools for digital twin",a:"Qinglin Qi et al.",y:2021,j:"Journal of Manufacturing",if:12.2,ci:1969,p:2,tags:["found"],note:"Technology stack for DT — useful for your enabling technologies chapter"},

  {t:"Shaping the digital twin for design and production engineering",a:"Schleich et al.",y:2017,j:"CIRP Annals",if:0,ci:1569,p:2,tags:["qual","found"],note:"Design-stage DT for production engineering — strong methodological parallel"},

let activeFilter='all';

function setFilter(f,btn){
  activeFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function matchFilter(p){
  if(activeFilter==='all') return true;
  if(activeFilter==='p1') return p.p===1;
  if(activeFilter==='p2') return p.p===2;
  if(activeFilter==='p3') return p.p===3;
  return p.tags.includes(activeFilter);
}

function priorityLabel(n){
  return ['','Must-read','Core','Supporting','Background'][n]||'';
}
function priorityBadge(n){
  return ['','b-p1','b-p2','b-p3','b-p4'][n]||'b-p4';
}
function dotClass(n){
  return ['','dot-p1','dot-p2','dot-p3','dot-p4'][n]||'dot-p4';
}
function tagLabel(t){
  const m={qual:'Design-for-quality',safe:'Design-for-safety',found:'Foundations',flc:'Lifecycle DT',tech:'Technology'};
  return m[t]||t;
}
function tagClass(t){
  const m={qual:'b-qual',safe:'b-safe',found:'b-found',flc:'b-flc',tech:'b-tech'};
  return m[t]||'b-tech';
}

function render(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const filtered=papers.filter(p=>{
    const matchQ=!q||p.t.toLowerCase().includes(q)||p.a.toLowerCase().includes(q);
    return matchQ && matchFilter(p);
  });

  const counts={p1:0,p2:0,p3:0,total:papers.length};
  papers.forEach(p=>{if(p.p===1)counts.p1++;if(p.p===2)counts.p2++;if(p.p===3)counts.p3++;});

  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="stat-n">${counts.total}</div><div class="stat-l">Total papers</div></div>
    <div class="stat"><div class="stat-n" style="color:#1D9E75">${counts.p1}</div><div class="stat-l">Must-read first</div></div>
    <div class="stat"><div class="stat-n" style="color:#378ADD">${counts.p2}</div><div class="stat-l">Core reading</div></div>
    <div class="stat"><div class="stat-n" style="color:#BA7517">${counts.p3}</div><div class="stat-l">Supporting</div></div>
  `;

  const sorted=filtered.sort((a,b)=>a.p-b.p||(b.ci-a.ci));

  let html='';
  let lastP=0;
  const labels={1:'Tier 1 — Must-read (read these first, ~15 papers)',2:'Tier 2 — Core reading (~15 papers)',3:'Tier 3 — Supporting (~10 papers)',4:'Tier 4 — Background / low priority'};
  sorted.forEach(p=>{
    if(p.p!==lastP){
      html+=`<div class="section-head">${labels[p.p]||''}</div>`;
      lastP=p.p;
    }
    const tagBadges=p.tags.map(t=>`<span class="badge ${tagClass(t)}">${tagLabel(t)}</span>`).join('');
    const pBadge=`<span class="badge ${priorityBadge(p.p)}">${priorityLabel(p.p)}</span>`;
    const cite=p.ci>0?`${p.ci.toLocaleString()} citations`:'' ;
    const ifStr=p.if>0?`IF ${p.if.toFixed(1)}`:'';
    html+=`<div class="paper">
      <div class="paper-top">
        <div class="priority-dot ${dotClass(p.p)}"></div>
        <div style="flex:1">
          <div class="paper-title">${p.t}</div>
          <div class="paper-meta">${p.a} · ${p.y>0?p.y:''} · ${p.j}${ifStr?' · '+ifStr:''}${cite?' · '+cite:''}</div>
          <div class="badges">${pBadge}${tagBadges}</div>
          <div style="font-size:12px;color:var(--color-text-secondary);margin-top:5px;line-height:1.4">${p.note}</div>
        </div>
      </div>
    </div>`;
  });
  document.getElementById('list').innerHTML=html||'<div style="padding:20px;color:var(--color-text-secondary);font-size:13px">No papers match this filter.</div>';
}

render();
</script>
