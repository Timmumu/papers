<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" width="1200" height="920">
  <defs>
    <marker id="aBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2980b9"/>
    </marker>
    <marker id="aRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e74c3c"/>
    </marker>
    <marker id="aGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1abc9c"/>
    </marker>
    <marker id="aOrange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e67e22"/>
    </marker>
    <filter id="sh" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="920" fill="#fafbfc"/>

  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Cognitive Full-Lifecycle Digital Twin — Knowledge Graph</text>
  <text x="600" y="50" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#7f8c8d">Architecture · Literature Gaps · Research Objectives · Falsifiability</text>

  <!-- ===== ROW 1: Layers (y=70-180) ===== -->
  <rect x="20" y="70" width="180" height="95" rx="8" fill="#fdebd0" stroke="#e67e22" stroke-width="1.5" filter="url(#sh)"/>
  <text x="110" y="94" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#e67e22">Physical Space</text>
  <text x="110" y="114" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">Sensors (IoT,LiDAR)</text>
  <text x="110" y="130" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">Actuators (Robots)</text>
  <text x="110" y="146" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">Workers &amp; Equipment</text>

  <rect x="220" y="70" width="220" height="95" rx="8" fill="#d4e6f1" stroke="#2980b9" stroke-width="1.5" filter="url(#sh)"/>
  <text x="330" y="94" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#2980b9">L1: Data Ingestion</text>
  <text x="330" y="114" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">MQTT / OPC-UA</text>
  <text x="330" y="130" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">Multi-modal sync</text>
  <text x="330" y="146" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">Stream processing</text>

  <rect x="460" y="70" width="220" height="95" rx="8" fill="#d4e6f1" stroke="#2980b9" stroke-width="1.5" filter="url(#sh)"/>
  <text x="570" y="94" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#2980b9">L2: Semantic KG</text>
  <text x="570" y="114" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">OWL Ontology</text>
  <text x="570" y="130" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">DfS/DfQ Rule Base</text>
  <text x="570" y="146" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">IFC Graph Topology</text>

  <rect x="700" y="70" width="220" height="95" rx="8" fill="#d4e6f1" stroke="#2980b9" stroke-width="1.5" filter="url(#sh)"/>
  <text x="810" y="94" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#2980b9">L3: Perception</text>
  <text x="810" y="114" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">Point Cloud Registration</text>
  <text x="810" y="130" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">Object Detection (YOLO)</text>
  <text x="810" y="146" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">Activity Recognition</text>

  <!-- Row 1 arrows -->
  <line x1="200" y1="117" x2="218" y2="117" stroke="#e67e22" stroke-width="2" marker-end="url(#aOrange)"/>
  <line x1="440" y1="117" x2="458" y2="117" stroke="#2980b9" stroke-width="2" marker-end="url(#aBlue)"/>
  <line x1="680" y1="117" x2="698" y2="117" stroke="#2980b9" stroke-width="2" marker-end="url(#aBlue)"/>

  <!-- ===== ROW 2: Convergence Mechanisms (y=190-300) ===== -->
  <rect x="130" y="195" width="420" height="95" rx="8" fill="#fadbd8" stroke="#e74c3c" stroke-width="2" filter="url(#sh)"/>
  <text x="340" y="220" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#e74c3c">L4: Backward Causal Updating</text>
  <text x="340" y="242" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">Observed variance Δ → Revise semantic priors &amp; DfS rules</text>
  <text x="340" y="260" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">φ(Δt, ∇L) maps residuals → ontology axiom / rule-parameter updates</text>
  <text x="340" y="278" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">Example: wind-conditional crane-distance rule from near-miss telemetry</text>

  <rect x="610" y="195" width="420" height="95" rx="8" fill="#d4e6f1" stroke="#2980b9" stroke-width="2" filter="url(#sh)"/>
  <text x="820" y="220" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#2980b9">L5: Forward Forecasting Engine</text>
  <text x="820" y="242" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">fθ(Ht, S, u) → predicted future state ôt+k</text>
  <text x="820" y="260" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">Spatio-temporal GNN / Deep state-space models</text>
  <text x="820" y="278" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">Conformal prediction → coverage-guaranteed UQ on hazards</text>

  <!-- L4→L2 feedback (curved upward) -->
  <path d="M340,195 L340,180 L680,180 L680,167" stroke="#e74c3c" stroke-width="1.8" stroke-dasharray="6,3" fill="none" marker-end="url(#aRed)"/>
  <text x="510" y="175" text-anchor="middle" font-family="Arial" font-size="9" fill="#e74c3c" font-style="italic">revised rules &amp; priors</text>

  <!-- L4→L5 -->
  <line x1="550" y1="242" x2="608" y2="242" stroke="#2980b9" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="579" y="234" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">semantic state</text>

  <!-- ===== ROW 3: RP Core Modules (y=320-440) ===== -->
  <rect x="20" y="320" width="1160" height="24" rx="4" fill="#2c3e50"/>
  <text x="600" y="337" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">PhD Research Proposal — Core Modules O1–O4</text>

  <rect x="20" y="355" width="265" height="70" rx="8" fill="#e8f8f5" stroke="#1abc9c" stroke-width="1.5" filter="url(#sh)"/>
  <text x="152" y="378" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1abc9c">O1: Multimodal Extraction</text>
  <text x="152" y="396" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">LLM structured-output + source-span citation</text>
  <text x="152" y="412" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">GraphRAG over Neo4j + CLIP alignment</text>

  <rect x="305" y="355" width="265" height="70" rx="8" fill="#e8f8f5" stroke="#1abc9c" stroke-width="1.5" filter="url(#sh)"/>
  <text x="437" y="378" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1abc9c">O2: GNN Risk Prediction</text>
  <text x="437" y="396" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">PyTorch Geometric over IFC topology</text>
  <text x="437" y="412" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">Cross-modal attention + MAPIE conformal</text>

  <rect x="590" y="355" width="265" height="70" rx="8" fill="#e8f8f5" stroke="#1abc9c" stroke-width="1.5" filter="url(#sh)"/>
  <text x="722" y="378" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1abc9c">O3: Convergence Algorithm</text>
  <text x="722" y="396" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">Lyapunov-style update + Chebyshev termination</text>
  <text x="722" y="412" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">BigQuery iteration-history + monotone L(state)</text>

  <rect x="875" y="355" width="265" height="70" rx="8" fill="#e8f8f5" stroke="#1abc9c" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1007" y="378" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1abc9c">O4: Self-Improving DT</text>
  <text x="1007" y="396" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">Closed-loop O1/O2 re-training on O3 logs</text>
  <text x="1007" y="412" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">2 case studies + cross-jurisdiction validation</text>

  <line x1="285" y1="390" x2="303" y2="390" stroke="#1abc9c" stroke-width="2" marker-end="url(#aGreen)"/>
  <line x1="570" y1="390" x2="588" y2="390" stroke="#1abc9c" stroke-width="2" marker-end="url(#aGreen)"/>
  <line x1="855" y1="390" x2="873" y2="390" stroke="#1abc9c" stroke-width="2" marker-end="url(#aGreen)"/>

  <!-- ===== ROW 4: Gap→Objective Mapping (y=460-570) ===== -->
  <rect x="20" y="460" width="1160" height="24" rx="4" fill="#c0392b"/>
  <text x="600" y="477" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">Literature Gaps → RP Objective Mapping (LR.md §4.5 → RP.md §2)</text>

  <rect x="20" y="495" width="218" height="62" rx="8" fill="#fff" stroke="#e74c3c" stroke-width="1.5" filter="url(#sh)"/>
  <text x="129" y="518" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#e74c3c">G1: Latency Transparency</text>
  <text x="129" y="535" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">80% lack full-stack timing</text>
  <text x="129" y="550" text-anchor="middle" font-family="Arial" font-size="8" fill="#1abc9c">→ O3: convergence loop bounds</text>

  <rect x="255" y="495" width="218" height="62" rx="8" fill="#fff" stroke="#e74c3c" stroke-width="1.5" filter="url(#sh)"/>
  <text x="364" y="518" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#e74c3c">G2: Single-Site Validation</text>
  <text x="364" y="535" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">67.1% single-site studies</text>
  <text x="364" y="550" text-anchor="middle" font-family="Arial" font-size="8" fill="#1abc9c">→ O4: 2 cases + cross-jurisdiction</text>

  <rect x="490" y="495" width="218" height="62" rx="8" fill="#fff" stroke="#e74c3c" stroke-width="1.5" filter="url(#sh)"/>
  <text x="599" y="518" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#e74c3c">G3: Semantic Brittleness</text>
  <text x="599" y="535" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">Closed-world OWL ontologies</text>
  <text x="599" y="550" text-anchor="middle" font-family="Arial" font-size="8" fill="#1abc9c">→ O1: LLM replaces rule-coding</text>

  <rect x="725" y="495" width="218" height="62" rx="8" fill="#fff" stroke="#e74c3c" stroke-width="1.5" filter="url(#sh)"/>
  <text x="834" y="518" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#e74c3c">G4: UQ Deficit</text>
  <text x="834" y="535" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">97.1% deterministic systems</text>
  <text x="834" y="550" text-anchor="middle" font-family="Arial" font-size="8" fill="#1abc9c">→ O2: conformal prediction UQ</text>

  <rect x="960" y="495" width="220" height="62" rx="8" fill="#fff" stroke="#e74c3c" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1070" y="518" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#e74c3c">G5: Governance Gap</text>
  <text x="1070" y="535" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">No audit-trail frameworks</text>
  <text x="1070" y="550" text-anchor="middle" font-family="Arial" font-size="8" fill="#1abc9c">→ O3/O4: iteration decision log</text>

  <!-- Gap→Objective mapping arrows -->
  <path d="M152,425 L152,493" stroke="#1abc9c" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#aGreen)"/>
  <path d="M1007,425 L1007,493" stroke="#1abc9c" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#aGreen)"/>
  <path d="M599,425 L599,493" stroke="#1abc9c" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#aGreen)"/>
  <path d="M437,425 L834,425 L834,493" stroke="#1abc9c" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#aGreen)"/>
  <path d="M722,425 L129,425 L129,493" stroke="#1abc9c" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#aGreen)"/>

  <!-- ===== ROW 5: Falsifiability & Validation (y=600-700) ===== -->
  <rect x="20" y="600" width="1160" height="24" rx="4" fill="#27ae60"/>
  <text x="600" y="617" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">Convergence Criterion &amp; Falsifiability Anchors</text>

  <rect x="20" y="635" width="560" height="55" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5" filter="url(#sh)"/>
  <text x="300" y="657" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#27ae60">Convergence Criterion (LR.md §5.4)</text>
  <text x="300" y="678" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">𝔼[Δt] &lt; ε  ∧  Var[Δt] &lt; δ  — DT is converged when observation residual is bounded</text>

  <rect x="600" y="635" width="580" height="55" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5" filter="url(#sh)"/>
  <text x="890" y="657" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#27ae60">Falsifiability (RP.md §2, panel-defence anchors)</text>
  <text x="890" y="678" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">O1: κ&lt;0.6→falsified | O2: coverage deviates&gt;10pp→falsified | O3: no monotone L(state)→falsified | O4: no positive checkpoint↔convergence correlation→falsified</text>

  <!-- ===== Decision Interface (y=715-760) ===== -->
  <rect x="250" y="715" width="700" height="40" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5" filter="url(#sh)"/>
  <text x="600" y="735" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#f39c12">Decision Interface: Uncertainty-Aware Intervention Thresholds · Human-in-the-Loop Override · Audit Trail</text>
  <text x="600" y="750" text-anchor="middle" font-family="Arial" font-size="9" fill="#555">Predicted Hazard/Drift → Intervention only if P(hazard | ôt+k) &gt; τ</text>

  <!-- ===== Cross-layer links ===== -->
  <!-- L5 → Decision -->
  <path d="M820,290 L820,713" stroke="#f39c12" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#aOrange)"/>
  <text x="835" y="500" font-family="Arial" font-size="8" fill="#f39c12" transform="rotate(90,835,500)">predicted hazard/drift</text>

  <!-- O4 → self-improving loop back to O1 (curved) -->
  <path d="M1140,390 L1165,390 L1165,242 L1060,242" stroke="#1abc9c" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#aGreen)"/>
  <text x="1178" y="310" font-family="Arial" font-size="8" fill="#1abc9c" transform="rotate(90,1178,310)">re-training signal</text>

  <!-- Legend -->
  <rect x="20" y="778" width="1160" height="32" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="0.5"/>
  <rect x="35" y="788" width="12" height="12" rx="2" fill="#fadbd8" stroke="#e74c3c" stroke-width="0.5"/>
  <text x="52" y="798" font-family="Arial" font-size="9" fill="#555">Convergence (L4)</text>
  <rect x="145" y="788" width="12" height="12" rx="2" fill="#d4e6f1" stroke="#2980b9" stroke-width="0.5"/>
  <text x="162" y="798" font-family="Arial" font-size="9" fill="#555">Digital Layers (L1-L5)</text>
  <rect x="280" y="788" width="12" height="12" rx="2" fill="#e8f8f5" stroke="#1abc9c" stroke-width="0.5"/>
  <text x="297" y="798" font-family="Arial" font-size="9" fill="#555">RP Core Modules (O1-O4)</text>
  <rect x="440" y="788" width="12" height="12" rx="2" fill="#fff" stroke="#e74c3c" stroke-width="0.5"/>
  <text x="457" y="798" font-family="Arial" font-size="9" fill="#555">Literature Gaps (G1-G5)</text>
  <rect x="590" y="788" width="12" height="12" rx="2" fill="#eafaf1" stroke="#27ae60" stroke-width="0.5"/>
  <text x="607" y="798" font-family="Arial" font-size="9" fill="#555">Falsifiability</text>
  <rect x="710" y="788" width="12" height="12" rx="2" fill="#fdebd0" stroke="#e67e22" stroke-width="0.5"/>
  <text x="727" y="798" font-family="Arial" font-size="9" fill="#555">Physical Space</text>
  <line x1="840" y1="794" x2="870" y2="794" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="875" y="798" font-family="Arial" font-size="9" fill="#555">Feedback (backward)</text>
  <line x1="990" y1="794" x2="1020" y2="794" stroke="#1abc9c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="1025" y="798" font-family="Arial" font-size="9" fill="#555">Gap→Objective mapping</text>

  <!-- ===== Data sources (bottom-left) ===== -->
  <rect x="20" y="830" width="560" height="40" rx="6" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#sh)"/>
  <text x="300" y="850" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#555">Data Sources (RP.md Table 1)</text>
  <text x="300" y="865" text-anchor="middle" font-family="Arial" font-size="8" fill="#777">Geometric (BIM) · Semantic (Specs,Regs) · Visual (Photos,UAV) · Temporal (4D,Gantt) · Environmental (IoT) · Relational (RFIs,Emails) · ESG (ICE,EPDs,Narratives)</text>

  <!-- Note -->
  <text x="600" y="900" text-anchor="middle" font-family="Arial" font-size="8" fill="#aaa">Figure: Knowledge graph linking the Cognitive DT architecture (LR.md §5), literature-identified gaps (LR.md §4.5), RP Core Modules (RP.md §2), and falsifiability criteria.</text>
</svg>